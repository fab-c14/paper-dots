<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160">
  <defs>
    <!-- Paper substrate shadow filter -->
    <filter id="logo-paper-drop" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1C1D1F" flood-opacity="0.10" />
    </filter>
    <!-- Organic ink bleed blur -->
    <filter id="logo-ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Paper Substrate -->
  <rect x="4" y="4" width="672" height="152" rx="24" fill="#FAF7F0" stroke="#E5DFD3" stroke-width="2" filter="url(#logo-paper-drop)" />

  <!-- Decorative Deckle Halftone Border Dots -->
  <g fill="#D8CFBD" opacity="0.45">
    <circle cx="24" cy="24" r="1.5" /><circle cx="44" cy="24" r="1.5" /><circle cx="64" cy="24" r="1.5" />
    <circle cx="616" cy="24" r="1.5" /><circle cx="636" cy="24" r="1.5" /><circle cx="656" cy="24" r="1.5" />
    <circle cx="24" cy="136" r="1.5" /><circle cx="44" cy="136" r="1.5" /><circle cx="64" cy="136" r="1.5" />
    <circle cx="616" cy="136" r="1.5" /><circle cx="636" cy="136" r="1.5" /><circle cx="656" cy="136" r="1.5" />
  </g>

  <!-- ================= LOGO MARK ================= -->
  <g transform="translate(18, 16)">
    <!-- Sub-tile for icon -->
    <rect x="8" y="8" width="112" height="112" rx="22" fill="#F4EFE6" stroke="#DFD7C7" stroke-width="1.8" />

    <!-- Deckle stipples -->
    <g fill="#C4B9A3" opacity="0.6">
      <circle cx="20" cy="20" r="1.2" />
      <circle cx="108" cy="20" r="1.2" />
      <circle cx="108" cy="108" r="1.2" />
      <circle cx="20" cy="108" r="1.2" />
    </g>

    <!-- Kinetic Acoustic Ripple Rings -->
    <circle cx="86" cy="38" r="18" fill="none" stroke="#FF48B0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.4" />
    <circle cx="86" cy="38" r="26" fill="none" stroke="#0078BF" stroke-width="1" stroke-dasharray="1.5 4" opacity="0.3" />

    <!-- Stem: Federal Blue (#0078BF) square chips -->
    <g fill="#0078BF" filter="url(#logo-ink-bleed)">
      <rect x="34" y="32" width="15" height="15" rx="3.5" />
      <rect x="34" y="50" width="15" height="15" rx="3.5" />
      <rect x="34" y="68" width="15" height="15" rx="3.5" />
      <rect x="34" y="86" width="15" height="15" rx="3.5" />
    </g>

    <!-- Loop: Fluo Pink (#FF48B0) chips & dots -->
    <g fill="#FF48B0" filter="url(#logo-ink-bleed)">
      <rect x="52" y="32" width="15" height="15" rx="3.5" />
      <circle cx="78" cy="40" r="8" />
      <rect x="80" y="50" width="14" height="14" rx="3.5" />
      <circle cx="76" cy="74" r="7.5" />
      <rect x="52" y="68" width="15" height="15" rx="3.5" />
    </g>

    <!-- Solar Kinetic Ink Bead (#FFE800) -->
    <circle cx="88" cy="36" r="6" fill="#FFE800" stroke="#F4EFE6" stroke-width="1.5" filter="url(#logo-ink-bleed)" />

    <!-- Flying confetti chips -->
    <rect x="96" y="78" width="4.5" height="4.5" rx="1" fill="#00A896" transform="rotate(25 98 80)" opacity="0.9" />
    <circle cx="26" cy="46" r="2.5" fill="#FF6B6B" opacity="0.8" />
    <rect x="24" y="80" width="4" height="4" rx="1" fill="#0078BF" transform="rotate(15 26 82)" opacity="0.7" />
  </g>

  <!-- ================= TYPOGRAPHY & TAGLINE ================= -->
  <g transform="translate(170, 0)">
    <!-- Main Title: PaperDots.js -->
    <text x="0" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="44" font-weight="900" letter-spacing="-1.5" fill="#1C1D1F">
      PaperDots<tspan fill="#FF48B0">.</tspan><tspan fill="#0078BF">js</tspan>
    </text>

    <!-- Badge: Shadcn Registry + Open AI -->
    <g transform="translate(340, 36)">
      <rect x="0" y="0" width="138" height="22" rx="11" fill="#0078BF" />
      <text x="69" y="15" font-family="monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
        SHADCN REGISTRY
      </text>
    </g>

    <!-- Subtitle: Tactile Risograph & Kinetic Dot Physics UI -->
    <text x="0" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#4B5563" letter-spacing="0.2">
      Tactile 2D Paper &amp; Risograph Dot-Physics UI Library
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 114)" font-family="monospace" font-size="11" font-weight="700">
      <!-- Pill 1: 60 FPS Canvas -->
      <rect x="0" y="0" width="94" height="20" rx="5" fill="#EAE3D4" />
      <text x="47" y="14" fill="#5A4E3C" text-anchor="middle">⚡ 60 FPS</text>

      <!-- Pill 2: Open-Source AI -->
      <rect x="102" y="0" width="128" height="20" rx="5" fill="#FFEBF6" />
      <text x="166" y="14" fill="#C0257E" text-anchor="middle">🧠 Gemma + Tinker</text>

      <!-- Pill 3: 100% Light Tactile -->
      <rect x="238" y="0" width="126" height="20" rx="5" fill="#E6F4FF" />
      <text x="301" y="14" fill="#005B94" text-anchor="middle">🎨 13 Spot Inks</text>

      <!-- Pill 4: Zero Dark SaaS -->
      <rect x="372" y="0" width="102" height="20" rx="5" fill="#E8F8F5" />
      <text x="423" y="14" fill="#0E705E" text-anchor="middle">📜 Real Paper</text>
    </g>
  </g>
</svg>
