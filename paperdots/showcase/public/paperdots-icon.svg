<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="icon-paper-drop" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1C1D1F" flood-opacity="0.14" />
    </filter>
    <filter id="icon-ink-bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="#FAF7F0" stroke="#E5DFD3" stroke-width="2.5" filter="url(#icon-paper-drop)" />

  <g fill="#D8CFBD" opacity="0.55">
    <circle cx="20" cy="20" r="1.5" />
    <circle cx="64" cy="14" r="1.2" />
    <circle cx="108" cy="20" r="1.5" />
    <circle cx="114" cy="64" r="1.2" />
    <circle cx="108" cy="108" r="1.5" />
    <circle cx="64" cy="114" r="1.2" />
    <circle cx="20" cy="108" r="1.5" />
    <circle cx="14" cy="64" r="1.2" />
  </g>

  <circle cx="86" cy="38" r="18" fill="none" stroke="#FF48B0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.4" />
  <circle cx="86" cy="38" r="26" fill="none" stroke="#0078BF" stroke-width="1" stroke-dasharray="1.5 4" opacity="0.3" />

  <g fill="#0078BF" filter="url(#icon-ink-bleed)">
    <rect x="34" y="32" width="15" height="15" rx="3.5" />
    <rect x="34" y="50" width="15" height="15" rx="3.5" />
    <rect x="34" y="68" width="15" height="15" rx="3.5" />
    <rect x="34" y="86" width="15" height="15" rx="3.5" />
  </g>

  <g fill="#FF48B0" filter="url(#icon-ink-bleed)">
    <rect x="52" y="32" width="15" height="15" rx="3.5" />
    <circle cx="78" cy="40" r="8" />
    <rect x="80" y="50" width="14" height="14" rx="3.5" />
    <circle cx="76" cy="74" r="7.5" />
    <rect x="52" y="68" width="15" height="15" rx="3.5" />
  </g>

  <circle cx="88" cy="36" r="6" fill="#FFE800" stroke="#FAF7F0" stroke-width="1.5" filter="url(#icon-ink-bleed)" />

  <rect x="94" y="76" width="4.5" height="4.5" rx="1" fill="#00A896" transform="rotate(25 96 78)" opacity="0.85" />
  <circle cx="28" cy="44" r="2.5" fill="#FF6B6B" opacity="0.75" />
  <rect x="25" y="78" width="4" height="4" rx="1" fill="#0078BF" transform="rotate(15 27 80)" opacity="0.6" />
