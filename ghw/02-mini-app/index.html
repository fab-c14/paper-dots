<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tip calculator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #6b6258;
      --paper: #f4efe6;
      --card: #fffaf3;
      --line: #e4d9c8;
      --accent: #0f6e56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 22px;
      box-shadow: 0 16px 40px rgba(28, 25, 21, 0.08);
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -0.03em; }
    p.lead { margin: 0 0 22px; color: var(--muted); }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; }
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      color: inherit;
    }
    .percents { display: flex; gap: 8px; margin: 8px 0 18px; }
    .percents button, .row button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    .percents button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .stepper { display: flex; align-items: center; gap: 10px; }
    output {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
    }
    output div { display: flex; justify-content: space-between; }
    output strong { font-size: 1.35rem; }
  </style>
</head>
<body>
  <main>
    <h1>Tip calculator</h1>
    <p class="lead">Split a bill without the mental math.</p>
    <label for="bill">Bill</label>
    <input id="bill" type="number" min="0" step="0.01" value="48.50" />
    <div class="percents" role="group" aria-label="Tip percent">
      <button type="button" data-tip="10">10%</button>
      <button type="button" data-tip="15">15%</button>
      <button type="button" data-tip="18" aria-pressed="true">18%</button>
      <button type="button" data-tip="20">20%</button>
    </div>
    <div class="row">
      <span>People</span>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer people">−</button>
        <span id="people">2</span>
        <button type="button" id="plus" aria-label="More people">+</button>
      </div>
    </div>
    <output id="result" aria-live="polite"></output>
  </main>
  <script>
    const bill = document.querySelector("#bill");
    const peopleEl = document.querySelector("#people");
    const result = document.querySelector("#result");
    const tips = [...document.querySelectorAll("[data-tip]")];
    let tip = 18;
    let people = 2;

    function money(n) {
      return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function render() {
      const amount = Math.max(0, Number(bill.value) || 0);
      const tipAmount = amount * (tip / 100);
      const total = amount + tipAmount;
      const each = total / people;
      result.replaceChildren();
      for (const [label, value, strong] of [
        ["Tip", money(tipAmount), false],
        ["Total", money(total), false],
        ["Each", money(each), true],
      ]) {
        const row = document.createElement("div");
        const name = document.createElement("span");
        name.textContent = label;
        const amountEl = document.createElement(strong ? "strong" : "span");
        amountEl.textContent = value;
        row.append(name, amountEl);
        result.append(row);
      }
    }

    tips.forEach((button) => {
      button.addEventListener("click", () => {
        tip = Number(button.dataset.tip);
        tips.forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
        render();
      });
    });
    document.querySelector("#minus").addEventListener("click", () => {
      people = Math.max(1, people - 1);
      peopleEl.textContent = String(people);
      render();
    });
    document.querySelector("#plus").addEventListener("click", () => {
      people = Math.min(20, people + 1);
      peopleEl.textContent = String(people);
      render();
    });
    bill.addEventListener("input", render);
    render();
  </script>
</body>
</html>
